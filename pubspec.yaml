name: rz_advance_widget
description: "Flutter Rz Advance Widget."
version: 1.0.0
repository: https://github.com/rzrasel/plugins-flutter-rz-advance-widget
homepage: https://github.com/rzrasel/plugins-flutter-rz-advance-widget

environment:
  sdk: ^3.13.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  plugin_platform_interface: ^2.0.2
  #
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  plugin:
    platforms:
      android:
        package: com.rzrasel.rz_advance_widget
        pluginClass: RzAdvanceWidgetPlugin
      ios:
        pluginClass: RzAdvanceWidgetPlugin
      linux:
        pluginClass: RzAdvanceWidgetPlugin
      macos:
        pluginClass: RzAdvanceWidgetPlugin
      windows:
        pluginClass: RzAdvanceWidgetPluginCApi
      web:
        pluginClass: RzAdvanceWidgetWeb
        fileName: rz_advance_widget_web.dart

